<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splits</title>
<meta name="description" content="A training plan generator and run tracker built around Google Health.">

<!-- PWA / iOS home screen setup -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Splits">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#14201c">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <span class="brand">Splits</span>
</header>

<main id="app">

  <!-- Google Health connection + manual sync -->
  <section id="syncBar" class="sync-bar" aria-live="polite">
    <div class="sync-status">
      <span id="syncDot" class="sync-dot" aria-hidden="true"></span>
      <div>
        <div id="syncTitle" class="sync-title">Google Health not connected</div>
        <div id="syncSub" class="sync-sub">Connect to pull in your runs</div>
      </div>
    </div>
    <div class="sync-actions">
      <button id="syncBtn" type="button" class="primary-btn compact hidden">Sync now</button>
      <button id="connectBtn" type="button" class="primary-btn compact">Connect Google Health</button>
    </div>
  </section>

  <!-- Empty state: no plan yet -->
  <section id="onboarding" class="screen">
    <h1>Build your plan</h1>
    <p class="lede">Tell Splits what you're training for. It lays out the weeks; you run them; it adjusts as you go.</p>

    <form id="planForm" class="plan-form">
      <label class="field">
        <span>Goal distance</span>
        <select id="goalDistance" required>
          <option value="5">5K</option>
          <option value="10">10K</option>
          <option value="21.1" selected>Half marathon</option>
          <option value="42.2">Marathon</option>
        </select>
      </label>

      <label class="field">
        <span>Race date</span>
        <input type="date" id="raceDate" required>
      </label>

      <label class="field">
        <span>Current weekly volume (km)</span>
        <input type="number" id="currentVolume" min="0" step="1" value="20" required>
      </label>

      <label class="field">
        <span>Runs per week</span>
        <input type="number" id="runsPerWeek" min="2" max="7" value="4" required>
      </label>

      <button type="submit" class="primary-btn">Generate plan</button>
    </form>
  </section>

  <!-- Main plan view -->
  <section id="planView" class="screen hidden">
    <div class="plan-header">
      <div>
        <h1 id="planTitle">Half marathon</h1>
        <p id="planSubtitle" class="lede">Week <span id="currentWeekNum">1</span> of <span id="totalWeeks">12</span></p>
      </div>
      <button id="resetBtn" class="ghost-btn small">Start over</button>
    </div>

    <div id="hero" class="hero"></div>

    <section class="card" aria-labelledby="chartTitle">
      <div class="card-head">
        <h2 id="chartTitle" class="section-title">Weekly volume</h2>
        <div class="legend">
          <span><i class="swatch target"></i>Target</span>
          <span><i class="swatch actual"></i>Run</span>
          <span><i class="swatch now"></i>This week</span>
        </div>
      </div>
      <div id="volumeChart" class="volume-chart" role="img"></div>
    </section>

    <section class="card" aria-labelledby="runsTitle">
      <div class="card-head">
        <h2 id="runsTitle" class="section-title">Recent runs</h2>
        <span id="runCount" class="card-meta"></span>
      </div>
      <div id="runLog" class="run-log"></div>
      <button id="runLogMore" type="button" class="ghost-btn small hidden">Show all</button>
    </section>

    <div class="card-head plan-title">
      <h2 class="section-title">Plan</h2>
      <div class="legend type-legend">
        <span><i class="swatch type-long"></i>Long</span>
        <span><i class="swatch type-quality"></i>Quality</span>
        <span><i class="swatch type-easy"></i>Easy</span>
      </div>
    </div>
    <div id="weekList" class="week-list"></div>
  </section>

</main>

<div id="toast" class="toast hidden"></div>
<div id="appVersion" class="app-version" aria-hidden="true"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/planGenerator.js"></script>
<script src="js/planStats.js"></script>
<script src="js/healthSync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
