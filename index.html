<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splits</title>
<meta name="description" content="A training plan generator and run tracker built around Google Health.">

<!-- PWA / iOS home screen setup -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Splits">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#12181C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main id="app">

  <!-- Empty state: no plan yet (also reused to edit the race goal) -->
  <section id="onboarding" class="view" data-view="onboarding" hidden>
    <h1 class="h1">Build your plan</h1>
    <p class="lede">Tell Splits what you're training for. It lays out the weeks; you run them; it adjusts as you go.</p>

    <form id="planForm" class="plan-form">
      <label class="field">
        <span>Goal distance</span>
        <select id="goalDistance" required>
          <option value="5">5K</option>
          <option value="10">10K</option>
          <option value="21.1" selected>Half marathon</option>
          <option value="42.2">Marathon</option>
          <option value="50">50K ultra</option>
          <option value="100">100K ultra</option>
        </select>
      </label>

      <label class="field">
        <span>Race date</span>
        <input type="date" id="raceDate" required>
      </label>

      <label class="field">
        <span>Longest run you can do comfortably now (km)</span>
        <input type="number" id="startingDistance" min="0" max="60" step="0.5" value="5" required aria-describedby="startHint">
        <p id="startHint" class="hint">Your longest recent run, or how far you can go without stopping. New to running? Enter 0 — we'll start you gently, with a long run of about 2 km in week 1.</p>
      </label>

      <label class="field">
        <span>Training days per week</span>
        <input type="number" id="trainingDays" min="2" max="7" value="3" required aria-describedby="daysHint">
        <p id="daysHint" class="hint">Days a week you can realistically run. 3 is a good start; more days build fitness faster and let the plan go further. (6 or 7 days is six runs and a rest day.)</p>
      </label>

      <fieldset class="field level-field">
        <legend>Experience</legend>
        <div class="segmented" role="radiogroup" aria-describedby="levelHint">
          <label><input type="radio" name="experience" value="beginner" checked><span>Beginner</span></label>
          <label><input type="radio" name="experience" value="intermediate"><span>Intermediate</span></label>
          <label><input type="radio" name="experience" value="advanced"><span>Advanced</span></label>
        </div>
        <p id="levelHint" class="hint"></p>
      </fieldset>

      <section id="planPreview" class="preview" aria-live="polite" aria-label="Your plan at a glance" hidden></section>

      <div id="planWarning" class="warning" role="alert" hidden></div>

      <button type="submit" id="planSubmit" class="btn btn-primary">Generate plan</button>
      <button type="button" id="planCancel" class="btn btn-ghost" hidden>Cancel</button>
    </form>
  </section>

  <section id="view-today" class="view" data-view="today" hidden></section>
  <section id="view-plan" class="view" data-view="plan" hidden></section>
  <section id="view-progress" class="view" data-view="progress" hidden></section>
  <section id="view-profile" class="view" data-view="profile" hidden></section>
  <section id="view-session" class="view view-session" data-view="session" hidden></section>

</main>

<nav id="tabBar" class="tab-bar" aria-label="Sections" hidden>
  <div class="tab-bar-inner">
    <button type="button" class="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      <span>Today</span>
    </button>
    <button type="button" class="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
      <span>Plan</span>
    </button>
    <button type="button" class="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M12 19V4M20 19v-6"/></svg>
      <span>Progress</span>
    </button>
    <button type="button" class="tab" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
      <span>Profile</span>
    </button>
  </div>
</nav>

<!-- One bottom sheet, reused for "Mark done" distances and editing your name -->
<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <form id="sheetForm" class="sheet-form">
    <h2 id="sheetTitle" class="h2"></h2>
    <p id="sheetSub" class="sheet-sub"></p>
    <label class="field">
      <span id="sheetLabel"></span>
      <span class="input-unit">
        <input id="sheetInput">
        <span id="sheetUnit" class="unit"></span>
      </span>
    </label>
    <div class="btn-row">
      <button type="submit" id="sheetSave" class="btn btn-primary grow">Save</button>
      <button type="button" id="sheetCancel" class="btn btn-ghost">Cancel</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast hidden" role="status"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/planGenerator.js"></script>
<script src="js/planStats.js"></script>
<script src="js/healthSync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
